<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1684" height="1510" viewBox="0 0 1684 1510">
  <defs>
    <pattern id="dynamicPattern" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="30" height="30" fill="#a2152a"/>
      <path d="M-8 8 L8 -8 M0 30 L30 0 M22 38 L38 22" fill="none" stroke="#ff5a1f" stroke-width="5"/>
    </pattern>
    <pattern id="mibPattern" width="42" height="42" patternUnits="userSpaceOnUse">
      <rect width="42" height="42" fill="#a8201b"/>
      <path d="M-10 10 L10 -10 M0 42 L42 0 M32 52 L52 32" fill="none" stroke="#ffffff" stroke-width="4"/>
      <path d="M32 -10 L52 10 M0 0 L42 42 M-10 32 L10 52" fill="none" stroke="#ffffff" stroke-width="4"/>
    </pattern>
    <linearGradient id="retailGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1d4cd"/>
      <stop offset="1" stop-color="#c98d84"/>
    </linearGradient>
    <style>
      .font { font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif; }
      .ink { fill: #f4f5f4; }
      .muted { fill: #b8bfbb; }
      .red { fill: #ff6a24; }
      .leader { fill: none; stroke: #aeb6b2; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .redLeader { fill: none; stroke: #ff5a1f; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Donut base -->
  <g>
    <circle cx="930" cy="560" r="385" fill="none" stroke="#a2152a" stroke-width="190"/>

    <!-- Retail 4.3%, positioned at the bottom -->
    <circle cx="930" cy="560" r="385" pathLength="100" fill="none"
      stroke="url(#retailGradient)" stroke-width="190" stroke-linecap="butt"
      stroke-dasharray="4.3 95.7" transform="rotate(79 930 560)"/>

    <!-- CPA/Hybrid: 0.04%, shown as a thin gold locator -->
    <circle cx="930" cy="560" r="385" pathLength="100" fill="none"
      stroke="#c98f00" stroke-width="190" stroke-linecap="butt"
      stroke-dasharray="0.8 99.2" transform="rotate(94.48 930 560)"/>

    <!-- User-type dynamic classification overlay: 25.6% of total ND -->
    <circle cx="930" cy="560" r="385" pathLength="100" fill="none"
      stroke="url(#dynamicPattern)" stroke-width="190" stroke-linecap="butt"
      stroke-dasharray="25.6 74.4" transform="rotate(97.36 930 560)"/>

    <!-- May MIB historical reclassification overlay: -4.9% of total ND -->
    <circle cx="930" cy="560" r="385" pathLength="100" fill="none"
      stroke="url(#mibPattern)" stroke-width="190" stroke-linecap="butt"
      stroke-dasharray="4.9 95.1" transform="rotate(189.52 930 560)"/>
  </g>

  <!-- Radial separators calculated from the exact segment boundary angles -->
  <line x1="985.3" y1="844.7" x2="1021.6" y2="1031.2" stroke="#ffffff" stroke-width="11"/>
  <line x1="907.4" y1="849.1" x2="892.5" y2="1038.5" stroke="#ffffff" stroke-width="4"/>
  <line x1="892.9" y1="847.6" x2="868.5" y2="1036.1" stroke="#ffffff" stroke-width="4"/>

  <!-- Main values -->
  <text class="font" x="930" y="530" text-anchor="middle" font-size="98" font-weight="700" fill="#ffffff">$20.3M</text>
  <text class="font muted" x="930" y="612" text-anchor="middle" font-size="46">总 Net Deposit</text>

  <text class="font" x="930" y="155" text-anchor="middle" font-size="51" font-weight="500" fill="#ffffff">IB $19.4M</text>
  <text class="font" x="930" y="215" text-anchor="middle" font-size="45" fill="#ffffff">占总 ND 95.7%</text>

  <!-- Left callouts -->
  <polyline class="leader" points="472,420 380,420 325,370"/>
  <text class="font red" x="58" y="300" font-size="43" font-weight="700">5月 MIB口径变更</text>
  <text class="font ink" x="58" y="365" font-size="43">占总ND -4.9%</text>

  <polyline class="redLeader" points="508,735 420,842 368,842"/>
  <text class="font red" x="58" y="790" font-size="43" font-weight="700">全民IB动态分类</text>
  <text class="font ink" x="58" y="855" font-size="43">占总ND 25.6%</text>

  <!-- Bottom callouts -->
  <polyline class="leader" points="880,1037 868,1090 579,1160"/>
  <text class="font ink" x="165" y="1170" font-size="42">CPA/Hybrid $0.01M</text>
  <text class="font muted" x="300" y="1230" font-size="40">占总 ND 0.04%</text>

  <polyline class="leader" points="930,1034 930,1091 1210,1091"/>
  <text class="font ink" x="1234" y="1108" font-size="43">Retail $0.9M</text>
  <text class="font muted" x="1234" y="1168" font-size="40">占总 ND 4.3%</text>

  <!-- Legend: category colors -->
  <g transform="translate(535 1322)">
    <rect x="0" y="0" width="48" height="48" rx="5" fill="#a2152a" stroke="#6f0d1c" stroke-width="2"/>
    <text class="font ink" x="73" y="40" font-size="39">IB</text>

    <rect x="190" y="0" width="48" height="48" rx="5" fill="url(#retailGradient)" stroke="#aeb8b2" stroke-width="2"/>
    <text class="font ink" x="265" y="40" font-size="39">Retail</text>

    <rect x="455" y="0" width="48" height="48" rx="5" fill="#c98f00" stroke="#a87300" stroke-width="2"/>
    <text class="font ink" x="530" y="40" font-size="39">CPA/Hybrid</text>
  </g>

  <!-- Legend: attribution overlays -->
  <g transform="translate(458 1412)">
    <rect x="0" y="0" width="48" height="48" rx="5" fill="url(#dynamicPattern)" stroke="#ff5a1f" stroke-width="4"/>
    <text class="font ink" x="72" y="40" font-size="38">全民IB 动态分类</text>

    <rect x="474" y="0" width="48" height="48" rx="5" fill="url(#mibPattern)" stroke="#8e1713" stroke-width="3"/>
    <text class="font ink" x="547" y="40" font-size="38">5月 MIB 口径变更</text>
  </g>
</svg>
